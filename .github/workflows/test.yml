name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check
        run: for file in config.lua shared/*.lua client/*.lua server/*.lua tests/*.lua; do luac5.4 -p "$file"; done
      - name: Server tests
        run: lua5.4 tests/server_test.lua
      - name: Client tests
        run: lua5.4 tests/client_test.lua
